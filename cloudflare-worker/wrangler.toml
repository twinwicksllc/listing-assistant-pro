name = "ebay-proxy"
main = "ebay-proxy.js"
compatibility_date = "2024-01-01"

# Workers free tier is sufficient for this proxy
# Deploy with: wrangler deploy

# Set your proxy secret with:
#   wrangler secret put PROXY_SECRET
# Then add the same value as EBAY_PROXY_SECRET in Supabase Edge Function secrets.

[vars]
# PROXY_SECRET is set via `wrangler secret put PROXY_SECRET` (not here, to keep it out of source)