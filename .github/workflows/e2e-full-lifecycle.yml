name: E2E Full Lifecycle Tests

on:
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  # See e2e-pr-smoke.yml: the suite reads only E2E_-prefixed values from the "E2E"
  # environment, which cannot fall back to the production secrets, and is skipped until that
  # environment is configured. This suite also needs a deployed site to test.
  e2e-config:
    name: E2E configuration
    runs-on: ubuntu-latest
    environment: E2E
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - name: Check E2E configuration
        id: check
        run: bash scripts/e2e-config-check.sh
        env:
          E2E_REQUIRE_BASE_URL: "yes"
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_KEY }}
          E2E_FORBIDDEN_REF: wcednzaxmxwfiijzmjmx

  full-lifecycle:
    name: Full Lifecycle Tests
    needs: e2e-config
    if: needs.e2e-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: E2E
    permissions:
      contents: read
    # NOTE: this job previously ran in the mcr.microsoft.com/playwright:v1.48-jammy
    # container image. MCR purged that tag (all five weekly runs since 2026-08-10
    # failed with "manifest unknown" before any test ran), and the tag never matched
    # the lockfile anyway (@playwright/test is pinned to 1.60.0). The smoke workflow
    # (e2e-pr-smoke.yml, green on every push) proves the host-runner +
    # `npx playwright install --with-deps chromium` + cache pattern works for this
    # repo, so this now mirrors that pattern instead of pinning a container image
    # that goes stale the moment Microsoft rotates tags.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup test user in Supabase
        run: node scripts/setup-test-user.js
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_KEY }}

      # E2E_BASE_URL is required by the configuration job above, so this suite never falls
      # back to Playwright's localhost dev server (the failure mode that went unnoticed before).
      - name: Run full lifecycle tests
        run: npx playwright test e2e/tests/full-lifecycle.spec.ts
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL }}
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          EBAY_SANDBOX_API_KEY: ${{ secrets.E2E_EBAY_SANDBOX_API_KEY }}
          STRIPE_TEST_CARD: "4242424242424242"
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full-lifecycle
          path: playwright-report/
          retention-days: 30

      - name: Cleanup old test data
        if: success()
        run: |
          # This would call a script/function to clean up old test listings
          # For now, just log
          echo "Cleanup: Removing test data older than 7 days"
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_KEY }}

      # NOTE: the original notify step called issues.createComment with
      # context.issue.number, which is undefined on schedule/workflow_dispatch
      # runs -- the step itself errored whenever tests failed. Use a commit
      # comment instead (same pattern as e2e-pr-smoke.yml's comment-push job);
      # it works without PR context because it targets github.sha directly.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: process.env.GITHUB_SHA,
              body: `❌ **Full Lifecycle E2E Tests Failed** - [View Report](${runUrl})`
            });
