name: E2E Full Lifecycle Tests

on:
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  full-lifecycle:
    name: Full Lifecycle Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run full lifecycle tests
        run: npx playwright test e2e/tests/full-lifecycle.spec.ts
        env:
          BASE_URL: ${{ secrets.QA_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EBAY_SANDBOX_API_KEY: ${{ secrets.EBAY_SANDBOX_API_KEY }}
          STRIPE_TEST_CARD: '4242424242424242'
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full-lifecycle
          path: playwright-report/
          retention-days: 30
      
      - name: Cleanup old test data
        if: success()
        run: |
          # This would call a script/function to clean up old test listings
          # For now, just log
          echo "Cleanup: Removing test data older than 7 days"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Full Lifecycle E2E Tests Failed** - [View Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            })
