name: E2E Full Lifecycle Tests

on:
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  full-lifecycle:
    name: Full Lifecycle Tests
    runs-on: ubuntu-latest
    # Pulls Supabase secrets from the QA environment (majmvgakczrpcwgxgulj)
    # rather than the repo-level secrets, which point at production. See
    # deploy-functions-qa.yml for the same pattern.
    environment: QA
    permissions:
      contents: read
    # NOTE: this job previously ran in the mcr.microsoft.com/playwright:v1.48-jammy
    # container image. MCR purged that tag (all five weekly runs since 2026-08-10
    # failed with "manifest unknown" before any test ran), and the tag never matched
    # the lockfile anyway (@playwright/test is pinned to 1.60.0). The smoke workflow
    # (e2e-pr-smoke.yml, green on every push) proves the host-runner +
    # `npx playwright install --with-deps chromium` + cache pattern works for this
    # repo, so this now mirrors that pattern instead of pinning a container image
    # that goes stale the moment Microsoft rotates tags.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup test user in Supabase
        run: node scripts/setup-test-user.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # This suite is meant to exercise a real deployed QA build, not the
      # local dev server. Playwright's webServer config in playwright.config.ts
      # silently falls back to `npm run dev` on localhost when BASE_URL is
      # unset -- which is exactly what happened every run until now (the
      # QA_BASE_URL secret never existed). Fail loudly instead of testing the
      # wrong thing without anyone noticing.
      - name: Verify QA_BASE_URL is set
        run: |
          if [ -z "${{ secrets.QA_BASE_URL }}" ]; then
            echo "::error::QA_BASE_URL secret is not set on the QA environment -- this suite is meant to test a real deployed QA build, not localhost. See LISTING_ASSISTANT_PRO_QA_SETUP.md."
            exit 1
          fi

      - name: Run full lifecycle tests
        run: npx playwright test e2e/tests/full-lifecycle.spec.ts
        env:
          BASE_URL: ${{ secrets.QA_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EBAY_SANDBOX_API_KEY: ${{ secrets.EBAY_SANDBOX_API_KEY }}
          STRIPE_TEST_CARD: "4242424242424242"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full-lifecycle
          path: playwright-report/
          retention-days: 30

      - name: Cleanup old test data
        if: success()
        run: |
          # This would call a script/function to clean up old test listings
          # For now, just log
          echo "Cleanup: Removing test data older than 7 days"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # NOTE: the original notify step called issues.createComment with
      # context.issue.number, which is undefined on schedule/workflow_dispatch
      # runs -- the step itself errored whenever tests failed. Use a commit
      # comment instead (same pattern as e2e-pr-smoke.yml's comment-push job);
      # it works without PR context because it targets github.sha directly.
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: process.env.GITHUB_SHA,
              body: `❌ **Full Lifecycle E2E Tests Failed** - [View Report](${runUrl})`
            });
