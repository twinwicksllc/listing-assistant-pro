name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Push Database Migrations
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail

          # Apply migrations using Supabase CLI
          # First link the project using the access token

          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

          # Repair any remote migrations that no longer exist locally
          # (marks them as reverted so db push doesn't complain)
          supabase migration repair --status reverted 20260324000000 || true
          supabase migration repair --status reverted 20260524000000 || true

          # Then push migrations (include-all handles missing historical migrations)
          supabase db push --yes --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          # Deploy all functions with JWT verification enabled by default
          supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

          # Every function below is marked verify_jwt = false in
          # supabase/config.toml, but the bulk deploy above does not reliably
          # apply that per-function setting (RBR-0028 follow-up: this gap left
          # competitor-prices-cron rejected by the platform's JWT gate before
          # its own code-level auth check ever ran — zero function logs on a
          # 401 is the signature of this, since the gateway rejects before
          # Deno starts). verify_jwt = false does NOT mean unauthenticated —
          # most of these do their own JWT/service-role/cron-secret check in
          # code (see CLAUDE.md's Auth pattern for Edge Functions).
          supabase functions deploy analyze-item --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy ebay-publish --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy ebay-pricing --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy spot-prices --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy transcribe-voice --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy ebay-user --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy ebay-listings --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy create-checkout --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy check-subscription --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy customer-portal --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy ebay-competitor-search --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy category-lookup --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy sync-ebay-taxonomy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy competitor-prices-cron --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy inventory-sync-cron --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy cost-alert-cron --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy cleanup-media-retention --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy backfill-ebay-token-encryption --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy backfill-knowledge-base-embeddings --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
          supabase functions deploy stripe-webhook --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
# Migration auto-apply enabled
