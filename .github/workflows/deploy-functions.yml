name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Database Migrations
        run: |
          # Apply migrations using Supabase REST API (POST /query via Management API)
          # Reference: https://supabase.com/docs/reference/api
          
          DB_URL="${{ secrets.SUPABASE_DATABASE_URL }}"
          
          if [ -z "$DB_URL" ]; then
            echo "Error: SUPABASE_DATABASE_URL secret not set"
            exit 1
          fi
          
          for migration in supabase/migrations/*.sql; do
            migration_name=$(basename "$migration")
            echo "Applying migration: $migration_name"
            
            # Read migration SQL
            sql=$(cat "$migration")
            
            # Execute SQL using psql via db-url
            psql "$DB_URL" -c "$sql"
            
            if [ $? -eq 0 ]; then
              echo "✅ Applied: $migration_name"
            else
              echo "❌ Failed: $migration_name"
              exit 1
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
# Migration auto-apply enabled
