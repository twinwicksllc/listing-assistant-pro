name: E2E PR Smoke Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite creates an auth user and runs a full AI analysis, so it needs a backend that is
  # not production. It reads only E2E_-prefixed values from the "E2E" environment; those names
  # exist nowhere at repository level, so an unset one cannot fall back to the production
  # secrets stored there. Until that environment is configured the suite is skipped (and the
  # check stays green) rather than pointed at the wrong project.
  e2e-config:
    name: E2E configuration
    runs-on: ubuntu-latest
    environment: E2E
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - name: Check E2E configuration
        id: check
        run: bash scripts/e2e-config-check.sh
        env:
          E2E_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_KEY }}
          E2E_FORBIDDEN_REFS: wcednzaxmxwfiijzmjmx,majmvgakczrpcwgxgulj

  smoke-tests:
    name: E2E Smoke Tests
    needs: e2e-config
    if: needs.e2e-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: E2E
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup test user in Supabase
        run: node scripts/setup-test-user.js
        env:
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_KEY }}

      - name: Run smoke tests
        run: npx playwright test e2e/tests/smoke.spec.ts
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL || 'http://localhost:8080' }}
          STRIPE_TEST_CARD: "4242424242424242"
          SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.E2E_VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  comment-pr:
    name: Comment PR with results
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Download test report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report

      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = './playwright-report/results.json';

            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const passed = results.stats.expected;
              const failed = results.stats.unexpected;

              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              const comment = `## 🧪 E2E Smoke Tests\n\n✅ Passed: ${passed}\n❌ Failed: ${failed}\n\n[View detailed report](${runUrl})`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              core.info('No results.json found to comment.');
            }

  comment-push:
    name: Comment Push with results
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Download test report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report

      - name: Comment push results (commit comment)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = './playwright-report/results.json';

            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const passed = results.stats.expected;
              const failed = results.stats.unexpected;

              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              const body = `## 🧪 E2E Smoke Tests (push)\n\n✅ Passed: ${passed}\n❌ Failed: ${failed}\n\n[View detailed report](${runUrl})`;

              // create a commit comment to record push results (safer than creating a repo issue)
              github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: process.env.GITHUB_SHA,
                body
              });
            } else {
              core.info('No results.json found to comment.');
            }
