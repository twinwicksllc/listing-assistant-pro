name: E2E PR Smoke Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Setup test user in Supabase
        run: node scripts/setup-test-user.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run smoke tests
        run: npx playwright test e2e/tests/smoke.spec.ts
        env:
          BASE_URL: ${{ secrets.QA_BASE_URL || 'http://localhost:8080' }}
          STRIPE_TEST_CARD: '4242424242424242'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  comment-pr:
    name: Comment PR with results
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download test report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report

      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = './playwright-report/results.json';

            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const passed = results.stats.expected;
              const failed = results.stats.unexpected;

              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              const comment = `## 🧪 E2E Smoke Tests\n\n✅ Passed: ${passed}\n❌ Failed: ${failed}\n\n[View detailed report](${runUrl})`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              core.info('No results.json found to comment.');
            }

  smoke-tests-container:
    name: E2E Smoke Tests (container)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48-jammy
    permissions:
      contents: read
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup test user in Supabase
        run: node scripts/setup-test-user.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run smoke tests (container)
        run: npx playwright test e2e/tests/smoke.spec.ts
        env:
          BASE_URL: ${{ secrets.QA_BASE_URL || 'http://localhost:8080' }}
          STRIPE_TEST_CARD: '4242424242424242'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  comment-push:
    name: Comment Push with results
    runs-on: ubuntu-latest
    needs: smoke-tests-container
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download test report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report

      - name: Comment push results (create issue)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = './playwright-report/results.json';

            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const passed = results.stats.expected;
              const failed = results.stats.unexpected;

              const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              const body = `## 🧪 E2E Smoke Tests (push)\n\n✅ Passed: ${passed}\n❌ Failed: ${failed}\n\n[View detailed report](${runUrl})`;

              // create an issue to record push results
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `E2E Smoke Results — ${process.env.GITHUB_REF_NAME} — ${process.env.GITHUB_RUN_ID}`,
                body
              });
            } else {
              core.info('No results.json found to comment.');
            }
      
