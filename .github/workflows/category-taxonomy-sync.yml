name: Category Taxonomy Maintenance

# Manual triggers for the two category-maintenance Edge Functions, the weekly
# category_mappings hygiene run, and the weekly golden-corpus snapshot refresh.
#
# SCHEDULING OWNERSHIP -- verified against production cron.job on 2026-08-24:
#
#   sync-ebay-taxonomy    pg_cron 'sync-ebay-taxonomy-weekly', Sun 03:11 UTC
#                         CONFIRMED PRESENT in cron.job.
#                         This workflow ALSO scheduled it (Sun 03:00), so it was
#                         being double-invoked -- a full-tree eBay pull twice, 11
#                         minutes apart. Now dispatch-only here; pg_cron owns it.
#
#   category-hygiene-cron pg_cron 'category-hygiene-weekly', Sun 04:11 UTC
#                         NOT PRESENT in cron.job. Migration
#                         20260824000000_schedule_category_hygiene_cron_properly.sql
#                         is merged but has NOT been applied to production, so
#                         this workflow is currently the ONLY thing running the
#                         hygiene job. Its schedule therefore stays here.
#
# What WAS wrong with the hygiene schedule, and what this fixes: it ran at Sun
# 02:00 UTC, an hour BEFORE the 03:11 taxonomy sync. Phase 5 gave the job a
# rot-detection duty (find_rotted_mappings) that compares category_mappings
# against ebay_taxonomy_cache, so running it pre-sync evaluated rot against a
# week-old cache and could flag rows 'needs_review' on stale evidence. It now
# runs at 04:47 UTC, after the sync has refreshed the cache. (GitHub Actions cron
# drifts under queue load -- observed 31-71 min late in category_hygiene_log --
# so the nominal time is set late enough that even a zero-drift run lands after
# the sync.)
#
# FOLLOW-UP, once 20260824000000 is actually applied: 'category-hygiene-weekly'
# will run at 04:11 and this workflow's 04:47 run becomes a duplicate. Delete the
# '47 4 * * 0' schedule below and make the category-hygiene job dispatch-only,
# matching sync-taxonomy. Verify first with:
#   SELECT jobname, schedule FROM cron.job ORDER BY jobname;
#
# Note on 20260824000000's Finding D: it concluded category-hygiene-cron had
# "never run" from inspecting cron.schedule() calls alone. That missed this
# workflow, which had POSTed the function weekly since 2026-07-18 (bb938ee) using
# SUPABASE_SERVICE_KEY -- a token requireCronSecret() accepts. Verified against
# production: category_hygiene_log holds six weekly rows, 2026-07-19 to
# 2026-08-23, all status=success. The score-based duties Phase 5 deleted were
# no-ops in every logged run ("expired": 0), so nothing load-bearing was removed.

on:
  schedule:
    # category_mappings hygiene -- Sunday 04:47 UTC, after pg_cron's 03:11
    # taxonomy sync, so rot detection reads a freshly-synced cache. Remove this
    # once pg_cron's 'category-hygiene-weekly' exists (see FOLLOW-UP above).
    - cron: "47 4 * * 0"
    # Golden-corpus snapshot refresh -- Sunday 05:47 UTC, comfortably after
    # pg_cron's 03:11 taxonomy sync has finished writing ebay_taxonomy_cache.
    # Off-minutes per the project convention for spacing scheduled jobs apart.
    - cron: "47 5 * * 0"
  workflow_dispatch: {}

jobs:
  sync-taxonomy:
    name: Sync eBay Taxonomy
    runs-on: ubuntu-latest
    # Manual only -- pg_cron 'sync-ebay-taxonomy-weekly' owns the schedule.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Call sync-ebay-taxonomy
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/sync-ebay-taxonomy" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' | tee /tmp/sync-result.json
      - name: Show result summary
        if: always()
        run: cat /tmp/sync-result.json || true

  category-hygiene:
    name: Category Hygiene Cleanup
    runs-on: ubuntu-latest
    # Scheduled here because pg_cron's 'category-hygiene-weekly' does not exist
    # yet (migration 20260824000000 unapplied) -- this is the only thing running
    # the hygiene job today. Make dispatch-only once that job is confirmed live.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 4 * * 0'
    steps:
      - name: Call category-hygiene-cron
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/category-hygiene-cron" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' | tee /tmp/hygiene-result.json
      - name: Show result summary
        if: always()
        run: cat /tmp/hygiene-result.json || true

  # Runs after pg_cron's weekly taxonomy sync (Phase 3/5 follow-up: the golden
  # corpus in corpus/golden_corpus.json ships with a FROZEN snapshot of
  # ebay_taxonomy_cache for reproducible CI replay, which would otherwise
  # silently drift every time that sync runs). This job re-validates the corpus
  # against the table Sunday's 03:11 UTC sync just refreshed, refreshes the
  # committed snapshot file, and opens a PR with the diff so drift is always a
  # reviewable change instead of an invisible staleness gap.
  #
  # This is the ONLY scheduled job in this workflow -- see the ownership note at
  # the top of the file.
  refresh-taxonomy-snapshot:
    name: Refresh Golden-Corpus Taxonomy Snapshot
    runs-on: ubuntu-latest
    needs: sync-taxonomy
    # 'skipped' is the normal path on the weekly schedule: pg_cron already ran
    # the sync at 03:11, so sync-taxonomy above is manual-only and does not run
    # here. On a workflow_dispatch run it DOES run, and must succeed first so the
    # snapshot is taken from a freshly-synced table. Without allowing 'skipped',
    # `needs` would suppress this job on every scheduled run.
    if: |
      always() &&
      (needs.sync-taxonomy.result == 'success' || needs.sync-taxonomy.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.event.schedule == '47 5 * * 0')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch live taxonomy, validate corpus, refresh snapshot
        id: refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/refresh-taxonomy-snapshot.mjs

      - name: Check whether the snapshot changed
        id: diff
        run: |
          if git diff --quiet -- corpus/ebay_taxonomy_snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with the refreshed snapshot
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/taxonomy-snapshot-refresh-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add corpus/ebay_taxonomy_snapshot.json
          git commit -m "chore: refresh golden-corpus taxonomy snapshot ($(date +%Y-%m-%d))"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          gh pr create \
            --title "chore: refresh golden-corpus taxonomy snapshot ($(date +%Y-%m-%d))" \
            --body "Auto-generated after this week's sync-ebay-taxonomy run. See the job log for the exact diff (added/removed/renamed/leaf-flipped categories) and confirmation that the golden corpus in \`corpus/golden_corpus.json\` still passes against live data." \
            --base main --head "$BRANCH" \
            || echo "PR may already exist for this branch/date; skipping create."
