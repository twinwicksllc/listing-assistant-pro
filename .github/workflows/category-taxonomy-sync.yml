name: Weekly Category Taxonomy Sync

# Runs two previously-unscheduled maintenance jobs:
#   - sync-ebay-taxonomy: pulls eBay's full active/current category tree
#     into ebay_taxonomy_cache (source of truth for category breadcrumbs
#     used by analyze-item and the frontend Analyze page)
#   - category-hygiene-cron: dedupes, decays, and expires stale/low-confidence
#     rows in category_mappings, and cleans up old cache/audit entries
#
# Both functions previously had comments claiming a weekly pg_cron schedule
# that was never actually created — they only ran when manually POSTed.
# This workflow is the actual schedule.

on:
  schedule:
    # eBay taxonomy full-tree sync — Sunday 03:00 UTC
    - cron: "0 3 * * 0"
    # category hygiene cleanup — Sunday 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch: {}

jobs:
  sync-taxonomy:
    name: Sync eBay Taxonomy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 0'
    steps:
      - name: Call sync-ebay-taxonomy
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/sync-ebay-taxonomy" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' | tee /tmp/sync-result.json
      - name: Show result summary
        if: always()
        run: cat /tmp/sync-result.json || true

  category-hygiene:
    name: Category Hygiene Cleanup
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 0'
    steps:
      - name: Call category-hygiene-cron
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/category-hygiene-cron" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' | tee /tmp/hygiene-result.json
      - name: Show result summary
        if: always()
        run: cat /tmp/hygiene-result.json || true

  # Runs immediately after the weekly taxonomy sync (Phase 3/5 follow-up:
  # the golden corpus in corpus/golden_corpus.json ships with a FROZEN
  # snapshot of ebay_taxonomy_cache for reproducible CI replay, which would
  # otherwise silently drift every time this sync runs. This job re-validates
  # the corpus against the table Sunday's sync just refreshed, refreshes the
  # committed snapshot file, and opens a PR with the diff so drift is always
  # a reviewable change instead of an invisible staleness gap.
  refresh-taxonomy-snapshot:
    name: Refresh Golden-Corpus Taxonomy Snapshot
    runs-on: ubuntu-latest
    needs: sync-taxonomy
    if: |
      always() && needs.sync-taxonomy.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 0')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch live taxonomy, validate corpus, refresh snapshot
        id: refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/refresh-taxonomy-snapshot.mjs

      - name: Check whether the snapshot changed
        id: diff
        run: |
          if git diff --quiet -- corpus/ebay_taxonomy_snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with the refreshed snapshot
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/taxonomy-snapshot-refresh-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add corpus/ebay_taxonomy_snapshot.json
          git commit -m "chore: refresh golden-corpus taxonomy snapshot ($(date +%Y-%m-%d))"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          gh pr create \
            --title "chore: refresh golden-corpus taxonomy snapshot ($(date +%Y-%m-%d))" \
            --body "Auto-generated after this week's sync-ebay-taxonomy run. See the job log for the exact diff (added/removed/renamed/leaf-flipped categories) and confirmation that the golden corpus in \`corpus/golden_corpus.json\` still passes against live data." \
            --base main --head "$BRANCH" \
            || echo "PR may already exist for this branch/date; skipping create."
