name: Test & Lint CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend: TypeScript, ESLint, Unit Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings 0

      - name: Unit Tests
        run: npm run test

      - name: Build
        run: npm run build

  # Edge Functions: Format check, type validation
  functions-check:
    name: Edge Functions Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check supabase/functions/

      - name: Lint functions
        run: deno lint --config supabase/functions/deno.json supabase/functions/

  # Category Resolver v2: golden-corpus replay harness (Phase 3)
  # Static/offline check that corpus/golden_corpus.json is internally
  # consistent with the frozen corpus/ebay_taxonomy_snapshot.json AND that
  # every dead/non-leaf id documented in the corpus is actually enforced by
  # leafCategoryGuard.ts's KNOWN_PARENT_CATEGORY_IDS blocklist. No live
  # Supabase/eBay credentials required, so this is fast and fully blocking.
  category-corpus-replay:
    name: Category Corpus Replay
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run leafCategoryGuard unit tests
        run: deno test --allow-net --allow-env supabase/functions/_helpers/leafCategoryGuard.test.ts

      - name: Run golden-corpus replay harness
        run: node scripts/replay-corpus.mjs

  # E2E Smoke Tests: Verify critical user flows work end-to-end
  e2e-smoke-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e:smoke
        continue-on-error: true

  # Integration tests require a local Supabase instance (Docker).
  # Standard GitHub Actions runners do not have Docker available, so these
  # tests are marked continue-on-error and excluded from the blocking summary.
  # Run locally with: supabase start && deno test --allow-net --allow-env ...
  integration-tests:
    name: Integration Tests (Supabase)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Type-check Edge Function tests
        run: |
          deno check --config supabase/functions/deno.json supabase/functions/analyze-item/test.ts
        continue-on-error: true

  # Send summary — frontend, functions-check, and category-corpus-replay are blocking
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        frontend-tests,
        functions-check,
        category-corpus-replay,
        e2e-smoke-tests,
        integration-tests,
      ]

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.frontend-tests.result }}" = "failure" ] || \
             [ "${{ needs.functions-check.result }}" = "failure" ] || \
             [ "${{ needs.category-corpus-replay.result }}" = "failure" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✅ All required tests passed"
          if [ "${{ needs.e2e-smoke-tests.result }}" != "success" ]; then
            echo "⚠️  E2E smoke tests did not fully complete (non-blocking)"
          fi
          if [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "⚠️  Integration tests skipped (require local Supabase/Docker)"
          fi
