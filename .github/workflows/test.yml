name: Test & Lint CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Frontend: TypeScript, ESLint, Unit Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: TypeScript type-check
        run: npx tsc --noEmit
      
      - name: ESLint
        run: npx eslint src/ --max-warnings 0
      
      - name: Unit Tests
        run: bun run test
      
      - name: Build
        run: bun run build

  # Edge Functions: Format check, type validation
  functions-check:
    name: Edge Functions Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      
      - name: Format check
        run: deno fmt --check supabase/functions/
      
      - name: Lint functions
        run: deno lint --config supabase/functions/deno.json supabase/functions/

  # Database: Integration tests with test items
  integration-tests:
    name: Integration Tests (Supabase)
    runs-on: ubuntu-latest
    
    # Start Postgres service for tests
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Start Supabase
        run: |
          supabase start --workdir . &
          # Wait for functions to be available
          sleep 45
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      
      - name: Run Edge Function tests
        run: |
          # Run tests sequentially to avoid port conflicts
          deno test --allow-net --allow-env supabase/functions/analyze-item/test.ts
        timeout-minutes: 10
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ijk3ZTFhNGQyLTljZTctNDg5YS04NDJkLWI1YTVmZDlhMWY0YSIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJpYXQiOjE2NTI3NDcwNjEsImV4cCI6MTk2ODMyNzA2MX0.DyP0OtUdOL6bOmS9UZJaQgJPzWFtBPpqhJPuOqAOFnc

  # Send summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [frontend-tests, functions-check, integration-tests]
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.frontend-tests.result }}" = "failure" ] || \
             [ "${{ needs.functions-check.result }}" = "failure" ] || \
             [ "${{ needs.integration-tests.result }}" = "failure" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          echo "✅ All tests passed"
